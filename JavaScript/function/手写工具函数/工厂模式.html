<!DOCTYPE html>
<html lang="en">

<head>

<body>
    <script>
        // 通过原型链继承创建一个新的对象
        function inherit(p) {
            if (p == null) throw TypeError();
            //p是一个对象,但不能是null
            // 如果0bject.create()存在
            // if (Object.create) return Object.create(p);
            var t = typeof p;
            //直接使用它
            if (t !== "object" & t !== "function") {
                console.log('入参必须是一个对象或函数')
                throw TypeError('入参必须是一个对象或函数')
            };

            function f() {}; //定义一个空构造函数
            console.log('p:', p);
            f.prototype = p; //将其原型属性设置为p


            return new f(); //使用f()创建p的继承对象
        }

        // function range(start, end) {
        //     var r = inherit(range.methods);
        //     r.start = start;
        //     r.end = end;
        //     return r;
        // }
        function range(start, end) {
            var r = new Object();
            r.start = start;
            r.end = end;
            return r;
        }
        range.methods = {
            includes: function(n) {
                return this.start <= n && n <= this.end;
            },
            map: function(fn) {
                var result = [];
                for (var i = this.start; i <= this.end; i++) {
                    result.push(fn(i));
                }
                return result;
            },
            foreach: function(fn) {
                for (var i = this.start; i <= this.end; i++) {
                    fn(i);
                }
            }
        }
        const r = range(1, 3);
        r.foreach(console.log)
        console.log('r:', r, 'r.incluede', r.includes(2))
        var obj = inherit({
            a: 1,
            b: 2
        });
        console.log('type:', typeof obj, 'obj:', obj, obj.a, obj.b);
    </script>
</body>

</html>
